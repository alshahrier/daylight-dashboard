/* ---- Stats ---- */

function viewStats(){
  const today = dateKey();
  const keys = last7Keys();
  const labels = keys.map(function(k){
    return keyToDate(k).toLocaleDateString(undefined, { weekday:"narrow" });
  });

  const totalTasks = state.tasks.length;
  const doneTasks = state.tasks.filter(function(t){ return t.done; }).length;
  const activeTasks = totalTasks - doneTasks;
  const overdue = state.tasks.filter(function(t){
    return !t.done && t.due && t.due < today;
  }).length;
  const rate = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

  const doneByDay = keys.map(function(k){
    return state.tasks.filter(function(t){
      return t.done && t.completedAt && dateKey(new Date(t.completedAt)) === k;
    }).length;
  });
  const weekDone = doneByDay.reduce(function(a, b){ return a + b; }, 0);

  const focusByDay = keys.map(focusMinutesOn);
  const weekFocus = focusByDay.reduce(function(a, b){ return a + b; }, 0);
  const totalFocus = state.sessions.reduce(function(a, s){ return a + s.minutes; }, 0);
  const todayFocus = focusMinutesOn(today);

  const habitRows = state.habits.map(function(h){
    const done = keys.filter(function(k){ return h.log[k]; }).length;
    return { name: h.name, done: done, color: h.color };
  });
  const habitDoneToday = state.habits.filter(function(h){ return h.log[today]; }).length;
  const bestStreak = state.habits.reduce(function(max, h){
    return Math.max(max, habitStreak(h));
  }, 0);

  let habitHTML;
  if (!state.habits.length){
    habitHTML = '<p class="muted small">No habits tracked yet.</p>';
  } else {
    habitHTML = habitRows.map(function(r){
      return progressRow(r.name, r.done, 7, r.color);
    }).join("");
  }

  return '<div class="page-head">' +
      '<div>' +
        '<h1>Statistics</h1>' +
        '<p class="muted small">A snapshot of your last seven days</p>' +
      '</div>' +
    '</div>' +

    '<div class="stats-grid">' +
      '<section class="card">' +
        '<h2 class="card-title">Tasks</h2>' +
        '<div class="stat-tiles">' +
          '<div class="stat-tile"><strong>' + totalTasks + '</strong><span>total</span></div>' +
          '<div class="stat-tile"><strong>' + doneTasks + '</strong><span>completed</span></div>' +
          '<div class="stat-tile"><strong>' + activeTasks + '</strong><span>active</span></div>' +
          '<div class="stat-tile"><strong>' + overdue + '</strong><span>overdue</span></div>' +
        '</div>' +
        '<div style="margin-top:18px">' +
          progressRow("Overall completion", doneTasks, totalTasks || 1) +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Tasks completed — last 7 days</h2>' +
        barChart(doneByDay, labels, "tasks") +
        '<p class="muted small" style="margin-top:10px">' + weekDone + ' completed this week · ' + rate + '% overall completion rate</p>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Focus time</h2>' +
        '<div class="stat-tiles">' +
          '<div class="stat-tile"><strong>' + todayFocus + '</strong><span>min today</span></div>' +
          '<div class="stat-tile"><strong>' + weekFocus + '</strong><span>min this week</span></div>' +
          '<div class="stat-tile"><strong>' + totalFocus + '</strong><span>min all time</span></div>' +
        '</div>' +
        '<div style="margin-top:18px">' +
          barChart(focusByDay, labels, "min") +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Habits</h2>' +
        '<div class="stat-tiles" style="margin-bottom:18px">' +
          '<div class="stat-tile"><strong>' + habitDoneToday + '/' + state.habits.length + '</strong><span>done today</span></div>' +
          '<div class="stat-tile"><strong>' + bestStreak + '</strong><span>best streak</span></div>' +
        '</div>' +
        habitHTML +
      '</section>' +
    '</div>';
}

/* ---- Settings ---- */

function viewSettings(){
  const s = state.settings;

  const swatches = ACCENTS.map(function(c){
    return '<button type="button" class="swatch' + (c.toLowerCase() === s.accent.toLowerCase() ? " active" : "") + '" data-accent="' + c + '" style="--sw:' + c + '" aria-label="Accent colour ' + c + '"></button>';
  }).join("");

  const widgetToggles = Object.keys(WIDGET_LABELS).map(function(k){
    return '<label class="switch-row">' +
      '<span class="switch-label">' + esc(WIDGET_LABELS[k]) + '</span>' +
      '<span class="switch"><input type="checkbox" data-widget="' + k + '"' + (s.widgets[k] ? " checked" : "") + '><span class="track"></span></span>' +
    '</label>';
  }).join("");

  let storageSize = "—";
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    storageSize = raw ? (Math.round((raw.length / 1024) * 10) / 10) + " KB" : "0 KB";
  } catch (e) { storageSize = "unavailable"; }

  return '<div class="page-head">' +
      '<div>' +
        '<h1>Settings</h1>' +
        '<p class="muted small">Personalise Daylight and manage your data</p>' +
      '</div>' +
    '</div>' +

    '<div class="settings-grid">' +
      '<section class="card">' +
        '<h2 class="card-title">Profile</h2>' +
        '<label class="field"><span>App name</span>' +
          '<input class="input" id="set-appname" maxlength="30" value="' + esc(s.appName) + '" placeholder="Daylight">' +
        '</label>' +
        '<label class="field"><span>Your name</span>' +
          '<input class="input" id="set-username" maxlength="40" value="' + esc(s.userName) + '" placeholder="Optional">' +
        '</label>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Appearance</h2>' +
        '<div class="field"><span>Theme</span>' +
          '<div class="segmented" id="theme-switch" role="group" aria-label="Theme">' +
            '<button type="button" data-theme-opt="light" class="' + (s.theme === "light" ? "active" : "") + '" aria-pressed="' + (s.theme === "light") + '">Light</button>' +
            '<button type="button" data-theme-opt="dark" class="' + (s.theme === "dark" ? "active" : "") + '" aria-pressed="' + (s.theme === "dark") + '">Dark</button>' +
          '</div>' +
        '</div>' +
        '<div class="field"><span>Accent colour</span>' +
          '<div class="swatches" style="flex-wrap:wrap;gap:8px">' + swatches +
            '<input type="color" class="color-input" id="accent-custom" value="' + esc(s.accent) + '" aria-label="Custom accent colour">' +
          '</div>' +
        '</div>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Dashboard widgets</h2>' +
        widgetToggles +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">Data</h2>' +
        '<p class="muted small" style="margin-bottom:16px">Everything is stored locally in this browser. Nothing is sent anywhere. Current size: ' + esc(storageSize) + '.</p>' +
        '<div class="row">' +
          '<button class="btn" type="button" data-action="export">' + icon("download") + 'Export JSON</button>' +
          '<button class="btn" type="button" data-action="import">' + icon("upload") + 'Import JSON</button>' +
          '<button class="btn btn-danger" type="button" data-action="reset">' + icon("trash") + 'Reset all data</button>' +
        '</div>' +
        '<input type="file" id="import-file" accept="application/json,.json" hidden>' +
      '</section>' +

      '<section class="card">' +
        '<h2 class="card-title">About</h2>' +
        '<p class="muted small">' + esc(s.appName) + ' is an offline-first personal dashboard. Tasks, habits, notes and focus sessions are saved automatically as you work.</p>' +
      '</section>' +
    '</div>';
}

/* ============================================================
   11. RENDERING & NAVIGATION
   ============================================================ */

const VIEWS = {
  dashboard: viewDashboard,
  tasks: viewTasks,
  habits: viewHabits,
  focus: viewFocus,
  notes: viewNotes,
  stats: viewStats,
  settings: viewSettings
};

let lastDay = dateKey();

function renderView(animate){
  const view = $("#view");
  if (!view) return;

  view.innerHTML = VIEWS[ui.route]();

  if (animate){
    view.classList.remove("view-enter");
    void view.offsetWidth;
    view.classList.add("view-enter");
    window.scrollTo({ top: 0, behavior: "auto" });
  }

  const title = $("#page-title");
  if (title) title.textContent = ROUTE_TITLES[ui.route];

  if (ui.route === "focus") updateTimerUI();
}

function updateNavActive(){
  $$("[data-nav]").forEach(function(el){
    const on = el.dataset.nav === ui.route;
    el.classList.toggle("active", on);
    if (el.classList.contains("nav-item") || el.classList.contains("mnav-item")){
      if (on) el.setAttribute("aria-current", "page");
      else el.removeAttribute("aria-current");
    }
  });
}

function navigate(route){
  if (ROUTES.indexOf(route) === -1) route = "dashboard";
  const changed = ui.route !== route;
  ui.route = route;
  if (location.hash !== "#" + route){
    try { history.replaceState(null, "", "#" + route); } catch (e) { /* ignore */ }
  }
  renderView(changed);
  updateNavActive();
}

function buildNav(){
  const nav = $(".nav");
  if (nav){
    nav.innerHTML = ROUTES.map(function(r){
      return '<button type="button" class="nav-item" data-nav="' + r + '">' +
        icon(r) + '<span>' + esc(ROUTE_TITLES[r]) + '</span>' +
      '</button>';
    }).join("");
  }
  const mnav = $(".mobile-nav");
  if (mnav){
    mnav.innerHTML = ROUTES.map(function(r){
      return '<button type="button" class="mnav-item" data-nav="' + r + '">' +
        icon(r) + '<span>' + esc(MOBILE_TITLES[r]) + '</span>' +
      '</button>';
    }).join("");
  }
}

/* ============================================================
   12. CLOCK
   ============================================================ */

function clockString(){
  return new Date().toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit" });
}

function tickClock(){
  const now = new Date();

  const ct = $("#clock-time");
  if (ct) ct.textContent = now.toLocaleTimeString(undefined, { hour:"2-digit", minute:"2-digit", second:"2-digit" });

  const cd = $("#clock-date");
  if (cd) cd.textContent = now.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });

  const heroTime = $("#hero-time");
  if (heroTime) heroTime.textContent = clockString();

  const heroGreet = $("#hero-greet");
  if (heroGreet){
    heroGreet.textContent = greeting() + (state.settings.userName ? ", " + state.settings.userName : "");
  }

  const heroDate = $("#hero-date");
  if (heroDate){
    heroDate.textContent = now.toLocaleDateString(undefined, { weekday:"long", month:"long", day:"numeric" });
  }

  /* Roll over at midnight */
  const today = dateKey();
  if (today !== lastDay){
    lastDay = today;
    if (ui.route === "dashboard" || ui.route === "tasks" || ui.route === "habits"){
      renderView(false);
    }
  }
}

/* ============================================================
   13. EVENT HANDLING
   ============================================================ */

function handleViewClick(e){
  /* Settings interactions that aren't data-action */
  const themeBtn = e.target.closest("[data-theme-opt]");
  if (themeBtn){ setTheme(themeBtn.dataset.themeOpt); return; }

  const accentBtn = e.target.closest("[data-accent]");
  if (accentBtn){ setAccent(accentBtn.dataset.accent); return; }

  const filterBtn = e.target.closest("[data-filter]");
  if (filterBtn){
    ui.taskFilter = filterBtn.dataset.filter;
    renderView(false);
    return;
  }

  const el = e.target.closest("[data-action]");
  if (!el) return;

  const action = el.dataset.action;
  const id = el.dataset.id;

  switch (action){
    case "toggle-task":        toggleTask(id); break;
    case "edit-task": {
      const t = state.tasks.find(function(x){ return x.id === id; });
      if (t) editTask(t);
      break;
    }
    case "delete-task":        deleteTask(id); break;
    case "new-task":           editTask(null); break;

    case "toggle-habit":       toggleHabitDay(id, dateKey()); break;
    case "toggle-habit-day":   toggleHabitDay(id, el.dataset.day); break;
    case "delete-habit":       deleteHabit(id); break;
    case "pick-color": {
      ui.habitColor = el.dataset.color;
      $$(".swatch[data-action='pick-color']").forEach(function(b){
        b.classList.toggle("active", b.dataset.color === ui.habitColor);
      });
      break;
    }

    case "open-note": {
      const n = state.notes.find(function(x){ return x.id === id; });
      if (n) editNote(n);
      break;
    }
    case "new-note":           editNote(null); break;
    case "delete-note":        deleteNote(id); break;

    case "timer-toggle":       timer.running ? pauseTimer() : startTimer(); break;
    case "timer-reset":        resetTimer(); break;
    case "timer-skip":         skipTimer(); break;
    case "set-mode":           setTimerMode(el.dataset.mode); break;

    case "quick-note-save":    saveQuickNote(); break;

    case "export":             exportData(); break;
    case "import": {
      const input = $("#import-file");
      if (input) input.click();
      break;
    }
    case "reset":              resetAllData(); break;
  }
}

function handleViewSubmit(e){
  const form = e.target;

  if (form.id === "task-form"){
    e.preventDefault();
    const titleEl = $("#task-title");
    const title = titleEl ? titleEl.value.trim() : "";
    if (!title){
      toast("Please enter a task title.", "error");
      if (titleEl) titleEl.focus();
      return;
    }
    const priorityEl = $("#task-priority");
    const dueEl = $("#task-due");

    state.tasks.unshift({
      id: uid(),
      title: title.slice(0, 200),
      notes: "",
      priority: priorityEl ? priorityEl.value : "medium",
      due: (dueEl && isDateKey(dueEl.value)) ? dueEl.value : "",
      done: false,
      createdAt: Date.now(),
      completedAt: null
    });
    saveState();
    renderView(false);
    const fresh = $("#task-title");
    if (fresh) fresh.focus();
    toast("Task added", "success");
    return;
  }

  if (form.id === "habit-form"){
    e.preventDefault();
    const nameEl = $("#habit-name");
    const name = nameEl ? nameEl.value.trim() : "";
    if (!name){
      toast("Please name your habit.", "error");
      if (nameEl) nameEl.focus();
      return;
    }
    state.habits.push({
      id: uid(),
      name: name.slice(0, 80),
      color: ui.habitColor,
      createdAt: Date.now(),
      log: {}
    });
    saveState();
    renderView(false);
    const fresh = $("#habit-name");
    if (fresh) fresh.focus();
    toast("Habit created", "success");
  }
}

function handleViewChange(e){
  const target = e.target;

  if (target.id === "task-sort"){
    ui.taskSort = target.value;
    renderView(false);
    return;
  }

  if (target.id === "import-file"){
    const file = target.files && target.files[0];
    target.value = "";
    if (file) importData(file);
    return;
  }

  if (target.dataset.pomo){
    const key = target.dataset.pomo;
    const limits = { focus:[1,180], short:[1,60], long:[1,120], longEvery:[1,12] };
    let value = parseInt(target.value, 10);
    if (!isFinite(value)) value = DEFAULT_SETTINGS.pomodoro[key];
    value = clamp(value, limits[key][0], limits[key][1]);
    target.value = value;
    state.settings.pomodoro[key] = value;
    saveState();
    if (!timer.running && !timer.started){
      timer.remaining = modeDuration(timer.mode);
    }
    updateTimerUI();
    return;
  }

  if (target.hasAttribute("data-pomo-sound")){
    state.settings.pomodoro.sound = !!target.checked;
    saveState();
    return;
  }

  if (target.dataset.widget){
    const key = target.dataset.widget;
    if (key in state.settings.widgets){
      state.settings.widgets[key] = !!target.checked;
      saveState();
      toast((target.checked ? "Widget shown" : "Widget hidden"));
    }
    return;
  }

  if (target.id === "set-appname"){
    const v = target.value.trim();
    if (!v){
      target.value = state.settings.appName;
      return;
    }
    state.settings.appName = v.slice(0, 30);
    saveState();
    updateBrand();
    return;
  }

  if (target.id === "set-username"){
    state.settings.userName = target.value.trim().slice(0, 40);
    saveState();
    return;
  }
}

function handleViewInput(e){
  const target = e.target;

  if (target.id === "set-appname"){
    const v = target.value.trim();
    if (v){
      state.settings.appName = v.slice(0, 30);
      saveState();
      updateBrand();
    }
    return;
  }

  if (target.id === "set-username"){
    state.settings.userName = target.value.trim().slice(0, 40);
    saveState();
    return;
  }

  if (target.id === "accent-custom"){
    setAccent(target.value);
  }
}

function handleViewKeydown(e){
  if ((e.key === "Enter" || e.key === " ") && e.target.matches('[data-action="open-note"]')){
    e.preventDefault();
    const n = state.notes.find(function(x){ return x.id === e.target.dataset.id; });
    if (n) editNote(n);
  }
}

function bindEvents(){
  /* Navigation (works anywhere in the document) */
  document.addEventListener("click", function(e){
    const navEl = e.target.closest("[data-nav]");
    if (navEl && !e.target.closest("#view")){
      navigate(navEl.dataset.nav);
    }
  });

  /* View-scoped delegation */
  const view = $("#view");
  view.addEventListener("click", function(e){
    const navEl = e.target.closest("[data-nav]");
    if (navEl){ navigate(navEl.dataset.nav); return; }
    handleViewClick(e);
  });
  view.addEventListener("submit", handleViewSubmit);
  view.addEventListener("change", handleViewChange);
  view.addEventListener("input", handleViewInput);
  view.addEventListener("keydown", handleViewKeydown);

  /* Theme toggles */
  const tt = $("#theme-toggle");
  if (tt) tt.addEventListener("click", function(){
    setTheme(state.settings.theme === "dark" ? "light" : "dark");
  });
  const st = $("#sidebar-theme");
  if (st) st.addEventListener("click", function(){
    setTheme(state.settings.theme === "dark" ? "light" : "dark");
  });

  /* Hash routing */
  window.addEventListener("hashchange", function(){
    const route = (location.hash || "").replace("#", "");
    if (ROUTES.indexOf(route) !== -1 && route !== ui.route){
      ui.route = route;
      renderView(true);
      updateNavActive();
    }
  });

  /* Re-sync timer when the tab becomes visible again */
  document.addEventListener("visibilitychange", function(){
    if (!document.hidden && timer.running){
      tickTimer();
    }
    if (!document.hidden){
      tickClock();
    }
  });

  /* Keyboard shortcuts: Alt+1…7 switches views */
  document.addEventListener("keydown", function(e){
    if (!e.altKey || e.ctrlKey || e.metaKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= ROUTES.length){
      e.preventDefault();
      navigate(ROUTES[n - 1]);
    }
  });
}

/* ============================================================
   14. INIT
   ============================================================ */

function init(){
  state = loadState();
  applyTheme();
  buildNav();
  bindEvents();

  const hash = (location.hash || "").replace("#", "");
  ui.route = ROUTES.indexOf(hash) !== -1 ? hash : "dashboard";

  /* Restore timer duration from saved settings */
  timer.remaining = modeDuration(timer.mode);

  renderView(false);
  updateNavActive();
  updateTimerUI();

  tickClock();
  setInterval(tickClock, 1000);
}

if (document.readyState === "loading"){
  document.addEventListener("DOMContentLoaded", init);
} else {
  init();
}

})();
</script>
